[package]
name = "btcdeb-engine"
version = "0.1.0"
edition = "2021"
description = "btcdeb-style Bitcoin Script stepping debugger, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitcoin = { version = "0.32.102", features = ["serde"] }
wasm-bindgen = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
